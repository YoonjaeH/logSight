version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logsight
    ports:
      - "5432:5432"

  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_NAME: logsight
      DB_USER: postgres
      DB_PASSWORD: password
    depends_on:
      - db